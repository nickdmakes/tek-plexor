name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_playlist:
        description: 'Optional public playlist URL for a live smoke test (downloads all entries, max 50)'
        type: string
        required: false
  schedule:
    - cron: '23 15 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify prerequisites and install dependencies
        run: |
          ffmpeg -version
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run unit, integration, and offline end-to-end tests
        run: python scripts/run_tests.py
      - name: Enforce coverage floor and record results
        run: |
          python -m coverage report
          python -m coverage xml
      - name: Check Python syntax and undefined names
        run: python -m ruff check --isolated --select E9,F821,F823 main.py tp_engine tp_conversion tp_interface utils scripts tests
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install verified actionlint release
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Validate GitHub Actions workflows
        run: /tmp/actionlint
      - name: Install pinned security tools
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Audit runtime and development dependencies
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: Scan application and maintenance scripts
        run: python -m bandit -r main.py tp_engine tp_conversion tp_interface utils scripts -ll
      - name: Install verified Gitleaks release
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan history and working files with secrets redacted
        run: python scripts/check_secrets.py

  package:
    name: Package (${{ matrix.os }})
    needs: [test, security]
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "tp_interface/ui/icons:tp_interface/ui/icons" main.py --name tek_plexor
      - name: Smoke test packaged application (Linux/macOS)
        if: runner.os != 'Windows'
        run: python scripts/smoke_packaged.py dist/tek_plexor
      - name: Smoke test packaged application (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke_packaged.py dist/tek_plexor.exe
      - name: Upload tested executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tek-plexor-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  live-smoke:
    name: Live playlist (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.live_playlist != ''
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PLAYLIST_URL: ${{ inputs.live_playlist }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
          python -m pip install -r requirements.txt
      - name: Validate live playlist and every converted file
        run: python scripts/live_smoke.py --playlist "$PLAYLIST_URL"
